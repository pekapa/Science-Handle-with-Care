name: Validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Lua and lint tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.2 liblua5.2-dev luarocks
          sudo luarocks --lua-version=5.2 install luacheck 1.2.0-1
          python -m pip install -r requirements-dev.txt
      - name: Install pinned StyLua binary
        env:
          STYLUA_VERSION: '2.3.1'
          STYLUA_SHA256: f0cfea40b3d72223497fa1650061f866e0d19a93a871aae22d3849f1bc9c2722
        run: |
          curl --fail --location --retry 2 --max-time 120 \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip" \
            --output "$RUNNER_TEMP/stylua.zip"
          echo "$STYLUA_SHA256  $RUNNER_TEMP/stylua.zip" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/stylua-bin"
          unzip -q "$RUNNER_TEMP/stylua.zip" -d "$RUNNER_TEMP/stylua-bin"
          chmod +x "$RUNNER_TEMP/stylua-bin/stylua"
          "$RUNNER_TEMP/stylua-bin/stylua" --version
          echo "$RUNNER_TEMP/stylua-bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pinned LuaLS binary
        env:
          LUALS_VERSION: '3.19.2'
          LUALS_SHA256: 93ad326b10f6c00911dd8c450fa098332dbd8f9f45d1052f5636a2d54479b947
        run: |
          curl --fail --location --retry 2 --max-time 120 \
            "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz" \
            --output "$RUNNER_TEMP/luals.tar.gz"
          echo "$LUALS_SHA256  $RUNNER_TEMP/luals.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/luals"
          tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C "$RUNNER_TEMP/luals"
          "$RUNNER_TEMP/luals/bin/lua-language-server" --version
          echo "$RUNNER_TEMP/luals/bin" >> "$GITHUB_PATH"
      - run: make test lint
  targets:
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.config.outputs.channels }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: config
        run: python3 -c 'import json; print("channels=" + json.dumps(json.load(open("scripts/engine-targets.json"))["targets"]))' >> "$GITHUB_OUTPUT"
  engine:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.channels) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FACTORIO_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Download official headless channel build
        run: |
          mkdir -p build/test-results
          curl --fail --location --retry 2 --max-time 120 \
            "$(python3 scripts/engine_config.py)" --output "$RUNNER_TEMP/factorio.tar.xz"
          sha256sum "$RUNNER_TEMP/factorio.tar.xz" > build/test-results/archive.sha256
          tar -xJf "$RUNNER_TEMP/factorio.tar.xz" -C "$RUNNER_TEMP"
      - name: Run isolated engine fixture
        run: make test-engine
        env:
          FACTORIO_BIN: ${{ runner.temp }}/factorio/bin/x64/factorio
      - name: Preserve engine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-${{ matrix.target }}
          path: build/test-results/
          if-no-files-found: warn
          retention-days: 7
