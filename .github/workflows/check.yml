name: Validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Lua and lint tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.2 liblua5.2-dev luarocks
          sudo luarocks --lua-version=5.2 install luacheck 1.2.0-1
          python -m pip install -r requirements-dev.txt
          cargo install stylua --version 2.3.1 --locked --features lua52
      - run: make test lint
  targets:
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.config.outputs.channels }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: config
        run: python3 -c 'import json; print("channels=" + json.dumps(json.load(open("scripts/engine-targets.json"))["targets"]))' >> "$GITHUB_OUTPUT"
  engine:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.channels) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FACTORIO_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Download official headless channel build
        run: |
          mkdir -p build/test-results
          curl --fail --location --retry 2 --max-time 120 \
            "$(python3 scripts/engine_config.py)" --output "$RUNNER_TEMP/factorio.tar.xz"
          sha256sum "$RUNNER_TEMP/factorio.tar.xz" > build/test-results/archive.sha256
          tar -xJf "$RUNNER_TEMP/factorio.tar.xz" -C "$RUNNER_TEMP"
      - name: Run isolated engine fixture
        run: make test-engine
        env:
          FACTORIO_BIN: ${{ runner.temp }}/factorio/bin/x64/factorio
      - name: Preserve engine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-${{ matrix.target }}
          path: build/test-results/
          if-no-files-found: warn
          retention-days: 7
