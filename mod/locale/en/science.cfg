[item-description]
shwc-beaker=Fragile science: survives 10 handling points. Pickup costs: ordinary/burner 1, long/fast 2, bulk/stack 4. Health drops 6.25 percentage points per handling point; 37.5% is the last safe health level.
[entity-description]
shwc-mixer=Automatically consumes one pack of each type present at craft start. Later arrivals wait for the next craft. One second per beaker, 90 kW plus 3 kW drain. Circuit disable pauses mixing.
shwc-lab=Researches with ordinary science and matching beakers. Other mixtures wait unused. Stored research credit is recovered on removal; recovered committed beakers have no handling allowance left.

[recipe-description]
shwc-intake=The ingredient and result slots show supported inputs and possible mixtures. The mixer samples inputs automatically: one red, one green, or one of each makes exactly ONE corresponding beaker. There is no selected mixture.
