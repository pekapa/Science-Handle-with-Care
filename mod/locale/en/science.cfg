shwc-beaker=Fragile science: survives 9 handling points; denatures at 10. Pickup costs: ordinary/burner 1, long/fast 2, bulk/stack 4. Health drops 10 percentage points per handling point; 10% is the last safe health level.
[entity-description]
shwc-mixer=Automatically consumes one pack of each type present at craft start. Later arrivals wait for the next craft. One second per output, 90 kW plus 3 kW drain. Circuit disable pauses mixing.

